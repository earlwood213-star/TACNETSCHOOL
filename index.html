<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET SCHOOL - Command & Driver Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        html, body { 
            width: 100%;
            height: 100%;
            background: #020926; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .view-switcher {
            height: 60px;
            background: rgba(1, 10, 42, 0.95);
            border-bottom: 2px solid #00f0ff;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2000;
            flex-shrink: 0;
        }

        .school-branding-tag {
            font-size: 18px;
            font-weight: 900;
            color: #00f0ff;
            letter-spacing: 1px;
        }

        .nav-btn-group { display: flex; gap: 10px; }

        .nav-btn { 
            background: rgba(10, 50, 160, 0.7); 
            color: #ffffff; 
            border: 2px solid #00f0ff; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-size: 14px;
            font-weight: 800; 
            cursor: pointer; 
        }
        .nav-btn.active { background: #00f0ff; color: #020926; box-shadow: 0 0 15px #00f0ff; }
        .nav-btn-setup { border-color: #fbbf24; color: #fbbf24; }
        .nav-btn-setup.active { background: #fbbf24; color: #020926; box-shadow: 0 0 15px #fbbf24; }

        #main-container { flex: 1; position: relative; width: 100%; height: calc(100vh - 60px); z-index: 1; }
        .view-panel { width: 100%; height: 100%; display: flex; }
        .hidden { display: none !important; }

        /* SETUP VIEW */
        #setup-view {
            flex-direction: row;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        .setup-card {
            width: 480px;
            background: rgba(0, 20, 60, 0.95);
            border: 2px solid #fbbf24;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .setup-map-card {
            flex: 1;
            height: 100%;
            min-height: 400px;
            background: rgba(0, 120, 255, 0.1);
            border: 2px solid #00f0ff;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full-width { grid-column: span 2; }

        .form-group label {
            font-size: 11px;
            font-weight: 800;
            color: #00f0ff;
            text-transform: uppercase;
        }

        input[type="text"] {
            background: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #00f0ff !important;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 10px #fbbf24;
        }

        .btn-search {
            background: #00f0ff;
            color: #020926;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-save-setup {
            background: #fbbf24;
            color: #020926;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        #setup-picker-map {
            width: 100%;
            height: 100%;
            min-height: 380px;
            border-radius: 12px;
            border: 1px solid #00f0ff;
            background: #111;
        }

        /* DRIVER VIEW */
        #driver-view { 
            flex-direction: column; 
            align-items: center;
            padding: 20px; 
            overflow-y: auto; 
            gap: 15px;
        }

        .glass-card {
            width: 100%;
            max-width: 750px;
            background: rgba(0, 120, 255, 0.12);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 18px;
            padding: 20px;
        }

        .driver-header { text-align: center; border-bottom: 2px solid rgba(0, 240, 255, 0.3); padding-bottom: 12px; }
        .main-title { font-size: 38px; font-weight: 900; color: #00f0ff; }
        .school-title-sub { font-size: 22px; font-weight: 800; color: #ffffff; margin-top: 2px; }
        .school-address-sub { font-size: 14px; color: #94a3b8; font-weight: 600; margin-top: 2px; }

        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
        .btn-large { padding: 20px; border-radius: 12px; border: 2px solid #fff; font-size: 22px; font-weight: 900; color: #fff; cursor: pointer; text-align: center; }
        .btn-green { background: #16a34a; }
        .btn-yellow { background: #ca8a04; }
        .btn-orange { background: #ea580c; }
        .btn-red { background: #991b1b; grid-column: span 2; font-size: 24px; padding: 22px; border: 3px solid #f87171; }

        .select-driver-slot { background: #000; color: #00f0ff; border: 2px solid #00f0ff; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; }

        /* COMMAND MONITOR VIEW */
        .sidebar { width: 380px; background: rgba(2, 9, 38, 0.95); border-right: 2px solid #00f0ff; display: flex; flex-direction: column; padding: 15px; gap: 12px; flex-shrink: 0; }
        .panel-glass { background: rgba(0, 120, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 12px; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        .input-row select { background: #000; color: #fff; border: 1px solid #00f0ff; padding: 8px; border-radius: 6px; flex: 1; }
        .btn-group-row { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { background: #00f0ff; color: #020926; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 2; }
        .erase-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 1; }

        .bus-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .bus-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; border-left: 4px solid #00f0ff; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 800; }
        .badge-GREEN { background: #22c55e; color: #fff; }

        .map-box { flex: 1; height: 100%; width: 100%; background: #050b1e; position: relative; }
        #map { width: 100%; height: 100%; min-height: 100%; background: #111; }
    </style>
</head>
<body>

    <div class="view-switcher">
        <div class="school-branding-tag" id="header-district-name">TACNET SCHOOL SYSTEM</div>
        <div class="nav-btn-group">
            <button id="tab-setup" class="nav-btn nav-btn-setup active" onclick="showView('setup')">⚙️ LOCATION SETUP</button>
            <button id="tab-driver" class="nav-btn" onclick="showView('driver')">🏠 DRIVER UI</button>
            <button id="tab-command" class="nav-btn" onclick="showView('command')">🖥️ MONITOR MAP</button>
        </div>
    </div>

    <div id="main-container">

        <div id="setup-view" class="view-panel">
            <div class="setup-card">
                <h2 style="color: #fbbf24; font-size: 18px; border-bottom: 2px solid #fbbf24; padding-bottom: 6px;">⚙️ SYSTEM & LOCATION SETUP</h2>
                
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>School District Name</label>
                        <input type="text" id="cfg-district" placeholder="Enter District Name" autocomplete="off">
                    </div>
                    <div class="form-group full-width">
                        <label>School Campus Name</label>
                        <input type="text" id="cfg-school" placeholder="Enter Campus Name" autocomplete="off">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Full Address Search (Nationwide)</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="cfg-address" placeholder="Type Street, City, State or Zip" autocomplete="off" style="flex: 1;">
                            <button type="button" class="btn-search" onclick="lookupAddress()">
