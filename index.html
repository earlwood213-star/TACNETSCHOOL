<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET SCHOOL - Command & Tactical Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        body { background: #020926; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .view-switcher { height: 60px; background: rgba(1, 10, 42, 0.98); border-bottom: 2px solid #00f0ff; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; z-index: 5000; flex-shrink: 0; }
        .school-branding-tag { font-size: 18px; font-weight: 900; color: #00f0ff; letter-spacing: 1px; }
        .nav-btn-group { display: flex; gap: 10px; }
        .nav-btn { background: rgba(10, 50, 160, 0.7); color: #ffffff; border: 2px solid #00f0ff; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; }
        .nav-btn.active { background: #00f0ff; color: #020926; box-shadow: 0 0 15px #00f0ff; }
        .nav-btn-setup { border-color: #fbbf24; color: #fbbf24; }
        .nav-btn-setup.active { background: #fbbf24; color: #020926; box-shadow: 0 0 15px #fbbf24; }
        #main-container { flex: 1; position: relative; width: 100%; height: calc(100vh - 60px); }
        .view-panel { width: 100%; height: 100%; display: flex; }
        .hidden { display: none !important; }
        #setup-view { flex-direction: row; padding: 20px; gap: 20px; overflow-y: auto; }
        .setup-card { width: 440px; background: rgba(0, 20, 60, 0.95); border: 2px solid #fbbf24; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 11px; font-weight: 800; color: #00f0ff; text-transform: uppercase; }
        input[type="text"] { background: #000000 !important; color: #ffffff !important; border: 2px solid #00f0ff !important; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .btn-save-setup { background: #fbbf24; color: #020926; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 8px; text-transform: uppercase; }
        .map-card { flex: 1; height: 100%; background: #000000; border: 2px solid #00f0ff; border-radius: 18px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .leaflet-map-frame { width: 100%; height: 100%; z-index: 1; }
        #driver-view { flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; gap: 15px; }
        .glass-card { width: 100%; max-width: 750px; background: rgba(0, 120, 255, 0.12); border: 2px solid rgba(0, 240, 255, 0.5); border-radius: 18px; padding: 20px; }
        .driver-header { text-align: center; border-bottom: 2px solid rgba(0, 240, 255, 0.3); padding-bottom: 12px; }
        .main-title { font-size: 38px; font-weight: 900; color: #00f0ff; }
        .school-title-sub { font-size: 22px; font-weight: 800; color: #ffffff; margin-top: 2px; }
        .school-address-sub { font-size: 14px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
        .btn-status { padding: 22px; border-radius: 12px; border: 3px solid #ffffff; font-size: 22px; font-weight: 900; color: #ffffff; cursor: pointer; text-align: center; }
        .btn-green { background: #16a34a; border-color: #4ade80; }
        .btn-yellow { background: #ca8a04; border-color: #fde047; }
        .btn-orange { background: #ea580c; border-color: #fdba74; }
        .btn-red { background: #991b1b; grid-column: span 2; font-size: 26px; padding: 24px; border-color: #f87171; }
        .select-driver-slot { background: #000; color: #00f0ff; border: 2px solid #00f0ff; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; outline: none; }
        .sidebar { width: 380px; background: rgba(2, 9, 38, 0.95); border-right: 2px solid #00f0ff; display: flex; flex-direction: column; padding: 15px; gap: 12px; flex-shrink: 0; }
        .panel-glass { background: rgba(0, 120, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 12px; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        .input-row select { background: #000; color: #fff; border: 1px solid #00f0ff; padding: 8px; border-radius: 6px; flex: 1; }
        .btn-group-row { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { background: #00f0ff; color: #020926; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 2; }
        .erase-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 1; }
        .bus-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .bus-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; border-left: 5px solid #00f0ff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .badge-GREEN { background: #16a34a; color: #fff; }
        .badge-YELLOW { background: #ca8a04; color: #fff; }
        .badge-ORANGE { background: #ea580c; color: #fff; }
        .badge-RED { background: #dc2626; color: #fff; }
        .bus-marker-pin { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 900; font-size: 11px; border: 2px solid #ffffff; }
        .bus-marker-GREEN { background: #16a34a; }
        .bus-marker-YELLOW { background: #ca8a04; }
        .bus-marker-ORANGE { background: #ea580c; }
        .bus-marker-RED { background: #dc2626; }
        .address-pin-dot { width: 20px; height: 20px; background: #fbbf24; border: 3px solid #ffffff; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="view-switcher">
        <div class="school-branding-tag" id="header-district-name">SCHOOL DISTRICT NAME</div>
        <div class="nav-btn-group">
            <button id="tab-setup" class="nav-btn nav-btn-setup active" onclick="showView('setup')">⚙️ LOCATION SETUP</button>
            <button id="tab-driver" class="nav-btn" onclick="showView('driver')">🏠 DRIVER UI</button>
            <button id="tab-command" class="nav-btn" onclick="showView('command')">🖥️ MONITOR MAP</button>
        </div>
    </div>
    <div id="main-container">
        <div id="setup-view" class="view-panel">
            <div class="setup-card">
                <h2 style="color: #fbbf24; font-size: 18px; border-bottom: 2px solid #fbbf24; padding-bottom: 6px;">⚙️ CAMPUS LOCATION SETUP</h2>
                <div class="form-grid">
                    <div class="form-group full-width"><label>School District Name</label><input type="text" id="cfg-district" placeholder="District Name"></div>
                    <div class="form-group full-width"><label>School Campus Name</label><input type="text" id="cfg-school" placeholder="School Name"></div>
                    <div class="form-group full-width"><label>Full Campus Street Address</label><input type="text" id="cfg-address" placeholder="Street Address"></div>
                    <div class="form-group"><label>City / Town</label><input type="text" id="cfg-city" placeholder="City"></div>
                    <div class="form-group"><label>State & Zip Code</label><input type="text" id="cfg-state-zip" placeholder="ST Zip"></div>
                </div>
                <button type="button" class="btn-save-setup" onclick="geocodeAndSave()">💾 SAVE & LAUNCH MAP</button>
            </div>
            <div class="map-card">
                <div style="padding: 10px; background: rgba(0, 240, 255, 0.1); border-bottom: 1px solid #00f0ff; font-size: 13px; font-weight: bold; color: #00f0ff;">📍 CLICK MAP TO SET CAMPUS CENTER</div>
                <div id="setupMap" class="leaflet-map-frame"></div>
            </div>
        </div>
        <div id="driver-view" class="view-panel hidden">
            <div class="glass-card">
                <div class="driver-header">
                    <div class="main-title">TACNET SCHOOL</div>
                    <div class="school-title-sub" id="driver-school-display">Configure School Name</div>
                    <div class="school-address-sub" id="driver-address-display">Configure Address in Setup</div>
                </div>
            </div>
            <div class="glass-card">
                <label style="color: #00f0ff; font-weight: bold;">SELECT YOUR BUS UNIT:</label>
                <select id="select-active-driver-slot" class="select-driver-slot" onchange="syncDriverView()"></select>
                <div style="font-size: 26px; font-weight: 900; color: #00f0ff;" id="driver-bus-title">Bus #101</div>
                <div style="font-size: 18px; color: #fff;" id="driver-name-sub">Driver: Unassigned</div>
                <div class="grid-buttons">
                    <button class="btn-status btn-green" onclick="setDriverStatus('GREEN')">GREEN (NORMAL)</button>
                    <button class="btn-status btn-yellow" onclick="setDriverStatus('YELLOW')">YELLOW (DELAY)</button>
                    <button class="btn-status btn-orange" onclick="setDriverStatus('ORANGE')">ORANGE (MECHANICAL)</button>
                    <button class="btn-status btn-red" onclick="setDriverStatus('RED')">🚨 RED EMERGENCY</button>
                </div>
            </div>
        </div>
        <div id="command-view" class="view-panel hidden">
            <div class="sidebar">
                <div class="panel-glass">
                    <p style="color: #00f0ff; font-weight: bold;">✏️ ASSIGN BUS & DRIVER</p>
                    <div class="input-row"><select id="select-slot" onchange="populateInputs()"></select></div>
                    <div class="input-row"><input type="text" id="input-bus-num" placeholder="Bus #"><input type="text" id="input-driver-name" placeholder="Driver Name"></div>
                    <div class="btn-group-row"><button class="action-btn" onclick="saveSlot()">💾 Save Unit</button><button class="erase-btn" onclick="clearSlot()">🗑️ Clear</button></div>
                </div>
                <div style="font-size: 16px; font-weight: bold; color: #00f0ff;">Active Fleet Units</div>
                <div class="bus-list" id="bus-list"></div>
            </div>
            <div class="map-card"><div id="monitorMap" class="leaflet-map-frame"></div></div>
        </div>
    </div>
    <script>
        let centerLat = 39.8283, centerLng = -98.5795;
        let setupMap, monitorMap, setupMarker, monitorAddressMarker, perimeterPolygon;
        let busMapMarkers = [];
        let CONFIG = { district: "", school: "", address: "", city: "", state_zip: "" };
        let fleet = [];

        function initFleet() {
            fleet = [];
            for (let i = 1; i <= 20; i++) {
                fleet.push({ slot: i, id: i === 1 ? '101' : '', driver: '', status: 'GREEN', lat: centerLat + (Math.random()-0.5)*0.01, lng: centerLng + (Math.random()-0.5)*0.01 });
            }
        }
        function initMaps() {
            setupMap = L.map('setupMap').setView([centerLat, centerLng], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(setupMap);
            setupMarker = L.marker([centerLat, centerLng], { draggable: true }).addTo(setupMap);
            setupMarker.on('dragend', e => { centerLat = e.target.getLatLng().lat; centerLng = e.target.getLatLng().lng; updatePerimeter(); });
            setupMap.on('click', e => { centerLat = e.latlng.lat; centerLng = e.latlng.lng; setupMarker.setLatLng(e.latlng); updatePerimeter(); });

            monitorMap = L.map('monitorMap').setView([centerLat, centerLng], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(monitorMap);
            updatePerimeter();
            renderAddressPin();
            renderBusMarkers();
        }
        function updatePerimeter() {
            let bounds = [[centerLat+0.002, centerLng-0.003], [centerLat+0.002, centerLng+0.003], [centerLat-0.002, centerLng+0.003], [centerLat-0.002, centerLng-0.003]];
            if (perimeterPolygon) monitorMap.removeLayer(perimeterPolygon);
            perimeterPolygon = L.polygon(bounds, { color: '#fbbf24', weight: 3, dashArray: '8, 8', fillColor: '#00f0ff', fillOpacity: 0.12 }).addTo(monitorMap);
        }
        function renderAddressPin() {
            if (monitorAddressMarker) monitorMap.removeLayer(monitorAddressMarker);
            let icon = L.divIcon({ html: `<div style="display:flex; align-items:center; gap:6px;"><div class="address-pin-dot"></div><span style="background:#020926; color:#fbbf24; padding:2px 8px; border:2px solid #fbbf24; border-radius:4px; font-weight:900;">📍 ${CONFIG.school || 'Campus'}</span></div>`, iconSize: [180,30], iconAnchor: [10,15] });
            monitorAddressMarker = L.marker([centerLat, centerLng], { icon: icon }).addTo(monitorMap);
        }
        function geocodeAndSave() {
            CONFIG.district = document.getElementById('cfg-district').value.trim() || "District";
            CONFIG.school = document.getElementById('cfg-school').value.trim() || "School";
            CONFIG.address = document.getElementById('cfg-address').value.trim();
            CONFIG.city = document.getElementById('cfg-city').value.trim();
            CONFIG.state_zip = document.getElementById('cfg-state-zip').value.trim();
            
            let query = [CONFIG.address, CONFIG.city, CONFIG.state_zip].filter(Boolean).join(', ');
            if (!query) { updatePerimeter(); renderAddressPin(); renderBusMarkers(); updateApp(); showView('command'); return; }

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        centerLat = parseFloat(data[0].lat); centerLng = parseFloat(data[0].lon);
                        setupMap.setView([centerLat, centerLng], 16); setupMarker.setLatLng([centerLat, centerLng]); monitorMap.setView([centerLat, centerLng], 16);
                        fleet.forEach(b => { b.lat = centerLat + (Math.random()-0.5)*0.01; b.lng = centerLng + (Math.random()-0.5)*0.01; });
                    }
                    updatePerimeter(); renderAddressPin(); renderBusMarkers(); updateApp(); showView('command');
                }).catch(() => { updatePerimeter(); renderAddressPin(); renderBusMarkers(); updateApp(); showView('command'); });
        }
        function renderBusMarkers() {
            busMapMarkers.forEach(m => monitorMap.removeLayer(m));
            busMapMarkers = [];
            fleet.forEach((b, i) => {
                let icon = L.divIcon({ html: `<div class="bus-marker-pin bus-marker-${b.status}" style="width:28px; height:28px;">${b.id||'S'+b.slot}</div>`, iconSize: [28,28], iconAnchor: [14,14] });
                let marker = L.marker([b.lat, b.lng], { icon: icon }).addTo(monitorMap);
                marker.bindPopup(`<b>Bus ${b.id||'Slot #'+b.slot}</b><br>Driver: ${b.driver||'Unassigned'}<br>Status: ${b.status}`);
                busMapMarkers.push(marker);
            });
        }
        function setDriverStatus(status) { let i = parseInt(document.getElementById('select-active-driver-slot').value)||0; fleet[i].status = status; renderSidebar(); renderBusMarkers(); }
        function updateApp() {
            document.getElementById('header-district-name').innerText = CONFIG.district.toUpperCase();
            document.getElementById('driver-school-display').innerText = `${CONFIG.school} - ${CONFIG.district}`;
            document.getElementById('driver-address-display').innerText = [CONFIG.address, CONFIG.city, CONFIG.state_zip].filter(Boolean).join(', ') || 'Ready';
            renderDropdowns(); renderSidebar(); populateInputs(); syncDriverView();
        }
        function renderDropdowns() {
            let opt = fleet.map((b,i)=>`<option value="${i}">Bus ${b.id||'#'+b.slot} ${b.driver?'('+b.driver+')':''}</option>`).join('');
            document.getElementById('select-slot').innerHTML = opt; document.getElementById('select-active-driver-slot').innerHTML = opt;
        }
        function populateInputs() { let i = parseInt(document.getElementById('select-slot').value)||0; document.getElementById('input-bus-num').value = fleet[i].id; document.getElementById('input-driver-name').value = fleet[i].driver; }
        function saveSlot() { let i = parseInt(document.getElementById('select-slot').value); fleet[i].id = document.getElementById('input-bus-num').value.trim(); fleet[i].driver = document.getElementById('input-driver-name').value.trim(); renderDropdowns(); document.getElementById('select-slot').value = i; renderSidebar(); syncDriverView(); renderBusMarkers(); }
        function clearSlot() { let i = parseInt(document.getElementById('select-slot').value); fleet[i].id = ''; fleet[i].driver = ''; document.getElementById('input-bus-num').value = ''; document.getElementById('input-driver-name').value = ''; renderDropdowns(); document.getElementById('select-slot').value = i; renderSidebar(); syncDriverView(); renderBusMarkers(); }
        function syncDriverView() { let i = parseInt(document.getElementById('select-active-driver-slot').value)||0; document.getElementById('driver-bus-title').innerText = fleet[i].id?`Bus #${fleet[i].id}`:`Slot #${fleet[i].slot}`; document.getElementById('driver-name-sub').innerText = fleet[i].driver?`Driver: ${fleet[i].driver}`:`Driver: Unassigned`; }
        function renderSidebar() {
            document.getElementById('bus-list').innerHTML = fleet.map((b,i)=>`<div class="bus-item" onclick="monitorMap.setView([${b.lat},${b.lng}],18)"><div><b>Bus ${b.id||'#'+b.slot}</b> (${b.driver||'Unassigned'})</div><span class="badge badge-${b.status}">${b.status}</span></div>`).join('');
        }
        function showView(v) {
            document.getElementById('setup-view').classList.toggle('hidden', v!=='setup');
            document.getElementById('driver-view').classList.toggle('hidden', v!=='driver');
            document.getElementById('command-view').classList.toggle('hidden', v!=='command');
            document.getElementById('tab-setup').classList.toggle('active', v==='setup');
            document.getElementById('tab-driver').classList.toggle('active', v==='driver');
            document.getElementById('tab-command').classList.toggle('active', v==='command');
            setTimeout(() => { if(v==='setup') setupMap.invalidateSize(); if(v==='command') monitorMap.invalidateSize(); }, 100);
        }
        window.onload = () => { initFleet(); initMaps(); updateApp(); showView('setup'); };
    </script>
</body>
</html>
