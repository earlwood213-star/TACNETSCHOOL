<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET School - Live GPS & Intercom Safety Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #021078; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { 
            background: #010a4a; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #00f0ff; 
            height: 60px;
        }
        .title { font-size: 20px; font-weight: bold; color: #00f0ff; }
        .nav-btn { 
            background: #0a32a0; 
            color: #fff; 
            border: 1px solid #00f0ff; 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .nav-btn.active { background: #00f0ff; color: #000; }

        #container { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }
        
        /* VIEWS */
        .view-panel { width: 100%; height: 100%; display: flex; }
        .hidden { display: none !important; }

        /* DRIVER VIEW */
        #driver-view { max-width: 450px; margin: auto; flex-direction: column; gap: 15px; padding: 20px; }
        .card { background: rgba(10, 50, 160, 0.6); border: 2px solid #00f0ff; border-radius: 12px; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        
        .btn-status { 
            padding: 15px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; text-align: center; 
        }
        .btn-green { background: #22c55e; }
        .btn-yellow { background: #eab308; color: #000; }
        .btn-orange { background: #f97316; }
        .btn-red { background: #ef4444; grid-column: span 2; font-size: 18px; }

        /* COMMAND MONITOR VIEW */
        .sidebar { width: 380px; background: #010a4a; border-right: 2px solid #00f0ff; display: flex; flex-direction: column; }
        .panel-box { padding: 12px; border-bottom: 1px solid #00f0ff; }
        .input-row { display: flex; gap: 5px; margin-top: 5px; }
        .input-row input, .input-row select { background: #000; color: #fff; border: 1px solid #00f0ff; padding: 6px; border-radius: 4px; flex: 1; }
        
        .action-btn { background: #00f0ff; color: #000; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .intercom-btn { background: #f97316; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }

        .bus-list { flex: 1; overflow-y: auto; }
        .bus-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; }

        .map-box { flex: 1; height: 100%; background: #000; position: relative; }
        #map { width: 100%; height: 100%; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-GREEN { background: #22c55e; }
        .badge-YELLOW { background: #eab308; color: #000; }
        .badge-ORANGE { background: #f97316; }
        .badge-RED { background: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="title">TACNET SCHOOL GPS</div>
        <div>
            <button id="tab-driver" class="nav-btn active" onclick="showView('driver')">Bus Driver View</button>
            <button id="tab-command" class="nav-btn" onclick="showView('command')">School Main Monitor</button>
        </div>
    </header>

    <div id="container">
        <div id="driver-view" class="view-panel">
            <div class="card">
                <h2 id="driver-bus-title" style="color: #00f0ff;">Slot #1 (Unassigned)</h2>
                <p>Status: Active GPS Beacon</p>
            </div>
            <div class="card">
                <p><b>BEACON STATUS CONTROLS</b></p>
                <div class="grid">
                    <button class="btn-status btn-green" onclick="setDriverStatus('GREEN')">GREEN<br><small>Normal</small></button>
                    <button class="btn-status btn-yellow" onclick="setDriverStatus('YELLOW')">YELLOW<br><small>Delay</small></button>
                    <button class="btn-status btn-orange" onmousedown="holdOrange()" onmouseup="releaseOrange()">🎙️ ORANGE<br><small>Hold to Talk</small></button>
                    <button class="btn-status btn-red" onclick="setDriverStatus('RED')">🚨 RED EMERGENCY</button>
                </div>
            </div>
            <div class="card">
                <p><b>Dispatch Feed:</b></p>
                <div id="driver-reply" style="color: #00f0ff; margin-top: 5px; font-weight: bold;">"Channel Ready"</div>
            </div>
        </div>

        <div id="command-view" class="view-panel hidden">
            <div class="sidebar">
                <div class="panel-box">
                    <p style="color: #00f0ff; font-weight: bold;">✏️ ASSIGN BUS NUMBERS</p>
                    <div class="input-row">
                        <select id="select-slot" onchange="loadSlotData()"></select>
                        <input type="text" id="input-bus-num" placeholder="Bus # (e.g. 104)">
                    </div>
                    <button class="action-btn" onclick="saveSlotData()">Save Bus Number</button>
                </div>

                <div class="panel-box" style="background: rgba(249, 115, 22, 0.15);">
                    <p style="color: #f97316; font-weight: bold;">🎙️ DISPATCH TALK BACK (ORANGE)</p>
                    <div class="input-row">
                        <select id="select-talk-slot"></select>
                    </div>
                    <div class="input-row">
                        <input type="text" id="input-msg" value="Copy that, proceed with caution.">
                    </div>
                    <button class="intercom-btn" onclick="transmitToDriver()">🎙️ TRANSMIT TO DRIVER</button>
                </div>

                <div style="padding: 10px; font-weight: bold; color: #00f0ff;">Active Bus Fleet (20 Slots)</div>
                <div class="bus-list" id="bus-list"></div>
            </div>

            <div class="map-box">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let busMarkers = {};
        let fleet = [];

        const baseLat = 37.5815;
        const baseLng = -79.0506;

        // Populate 20 slots
        for (let i = 1; i <= 20; i++) {
            fleet.push({
                slot: i,
                id: '',
                status: 'GREEN',
                lat: baseLat + (Math.random() - 0.5) * 0.06,
                lng: baseLng + (Math.random() - 0.5) * 0.06
            });
        }

        function showView(viewName) {
            const driverView = document.getElementById('driver-view');
            const commandView = document.getElementById('command-view');
            const tabDriver = document.getElementById('tab-driver');
            const tabCommand = document.getElementById('tab-command');

            if (viewName === 'driver') {
                driverView.classList.remove('hidden');
                commandView.classList.add('hidden');
                tabDriver.classList.add('active');
                tabCommand.classList.remove('active');
            } else {
                driverView.classList.add('hidden');
                commandView.classList.remove('hidden');
                tabCommand.classList.add('active');
                tabDriver.classList.remove('active');

                if (!map) {
                    initMapSystem();
                } else {
                    setTimeout(() => { map.invalidateSize(); }, 100);
                }
            }
        }

        function initMapSystem() {
            map = L.map('map').setView([baseLat, baseLng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            fleet.forEach(bus => {
                let marker = L.circleMarker([bus.lat, bus.lng], {
                    radius: 8,
                    fillColor: getColor(bus.status),
                    color: '#ffffff',
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(`<b>${bus.id ? 'Bus #' + bus.id : 'Slot #' + bus.slot}</b><br>Status: ${bus.status}`);
                busMarkers[bus.slot] = marker;
            });

            renderSidebarList();
            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function getColor(status) {
            if (status === 'YELLOW') return '#eab308';
            if (status === 'ORANGE') return '#f97316';
            if (status === 'RED') return '#ef4444';
            return '#22c55e';
        }

        function renderDropdowns() {
            const selSlot = document.getElementById('select-slot');
            const selTalk = document.getElementById('select-talk-slot');

            let html = fleet.map(b => `<option value="${b.slot - 1}">${b.id ? 'Bus #' + b.id : 'Slot #' + b.slot}</option>`).join('');
            selSlot.innerHTML = html;
            selTalk.innerHTML = html;
        }

        function loadSlotData() {
            let idx = document.getElementById('select-slot').value;
            document.getElementById('input-bus-num').value = fleet[idx].id;
        }

        function saveSlotData() {
            let idx = document.getElementById('select-slot').value;
            let val = document.getElementById('input-bus-num').value.trim();
            fleet[idx].id = val;

            if (idx == 0) {
                document.getElementById('driver-bus-title').innerText = val ? `Bus #${val}` : `Slot #1 (Unassigned)`;
            }

            renderDropdowns();
            document.getElementById('select-slot').value = idx;
            updateMapDisplay();
        }

        function updateMapDisplay() {
            fleet.forEach(bus => {
                if (busMarkers[bus.slot]) {
                    busMarkers[bus.slot].setStyle({ fillColor: getColor(bus.status) });
                    busMarkers[bus.slot].setPopupContent(`<b>${bus.id ? 'Bus #' + bus.id : 'Slot #' + bus.slot}</b><br>Status: ${bus.status}`);
                }
            });
            renderSidebarList();
        }

        function setDriverStatus(status) {
            fleet[0].status = status;
            updateMapDisplay();
        }

        function holdOrange() {
            setDriverStatus('ORANGE');
            document.getElementById('driver-reply').innerText = "🎙️ DRIVER TRANSMITTING...";
        }

        function releaseOrange() {
            document.getElementById('driver-reply').innerText = "Office Reply: Transmitted to Dispatch";
            setTimeout(() => { setDriverStatus('GREEN'); document.getElementById('driver-reply').innerText = "Channel Ready"; }, 3000);
        }

        function transmitToDriver() {
            let idx = document.getElementById('select-talk-slot').value;
            let msg = document.getElementById('input-msg').value;

            fleet[idx].status = 'ORANGE';
            updateMapDisplay();

            if (idx == 0) {
                document.getElementById('driver-reply').innerText = `📢 OFFICE: "${msg}"`;
            }

            setTimeout(() => {
                fleet[idx].status = 'GREEN';
                updateMapDisplay();
            }, 4000);
        }

        function renderSidebarList() {
            const list = document.getElementById('bus-list');
            if (!list) return;

            list.innerHTML = fleet.map(b => `
                <div class="bus-item" onclick="focusOnBus(${b.slot})">
                    <span>${b.id ? 'Bus #' + b.id : 'Slot #' + b.slot}</span>
                    <span class="badge badge-${b.status}">${b.status}</span>
                </div>
            `).join('');
        }

        function focusOnBus(slot) {
            let bus = fleet.find(b => b.slot == slot);
            if (bus && map) {
                map.setView([bus.lat, bus.lng], 14);
                busMarkers[slot].openPopup();
            }
        }

        window.onload = () => {
            renderDropdowns();
        };
    </script>
</body>
</html>
