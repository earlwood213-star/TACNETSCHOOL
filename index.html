<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET SCHOOL - Command & Tactical Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        
        body { 
            background: #020926; 
            color: #ffffff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* HEADER NAVIGATION */
        .view-switcher {
            height: 60px;
            background: rgba(1, 10, 42, 0.98);
            border-bottom: 2px solid #00f0ff;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5000;
            flex-shrink: 0;
        }

        .school-branding-tag {
            font-size: 18px;
            font-weight: 900;
            color: #00f0ff;
            letter-spacing: 1px;
        }

        .nav-btn-group { display: flex; gap: 10px; }

        .nav-btn { 
            background: rgba(10, 50, 160, 0.7); 
            color: #ffffff; 
            border: 2px solid #00f0ff; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-size: 14px;
            font-weight: 800; 
            cursor: pointer; 
        }
        .nav-btn.active { background: #00f0ff; color: #020926; box-shadow: 0 0 15px #00f0ff; }
        .nav-btn-setup { border-color: #fbbf24; color: #fbbf24; }
        .nav-btn-setup.active { background: #fbbf24; color: #020926; box-shadow: 0 0 15px #fbbf24; }

        #main-container { flex: 1; position: relative; width: 100%; height: calc(100vh - 60px); }
        .view-panel { width: 100%; height: 100%; display: flex; }
        .hidden { display: none !important; }

        /* SETUP PANEL */
        #setup-view {
            flex-direction: row;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        .setup-card {
            width: 480px;
            background: rgba(0, 20, 60, 0.95);
            border: 2px solid #fbbf24;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full-width { grid-column: span 2; }

        .form-group label {
            font-size: 11px;
            font-weight: 800;
            color: #00f0ff;
            text-transform: uppercase;
        }

        input[type="text"] {
            background: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #00f0ff !important;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 10px #fbbf24;
        }

        .btn-save-setup {
            background: #fbbf24;
            color: #020926;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        /* MAP DISPLAY CONTAINER */
        .map-card {
            flex: 1;
            height: 100%;
            background: #000000;
            border: 2px solid #00f0ff;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .map-canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* DRIVER VIEW */
        #driver-view { 
            flex-direction: column; 
            align-items: center;
            padding: 20px; 
            overflow-y: auto; 
            gap: 15px;
        }

        .glass-card {
            width: 100%;
            max-width: 750px;
            background: rgba(0, 120, 255, 0.12);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 18px;
            padding: 20px;
        }

        .driver-header { text-align: center; border-bottom: 2px solid rgba(0, 240, 255, 0.3); padding-bottom: 12px; }
        .main-title { font-size: 38px; font-weight: 900; color: #00f0ff; }
        .school-title-sub { font-size: 22px; font-weight: 800; color: #ffffff; margin-top: 2px; }
        .school-address-sub { font-size: 14px; color: #94a3b8; font-weight: 600; margin-top: 2px; }

        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
        .btn-status { 
            padding: 22px; 
            border-radius: 12px; 
            border: 3px solid #ffffff; 
            font-size: 22px; 
            font-weight: 900; 
            color: #ffffff; 
            cursor: pointer; 
            text-align: center;
            transition: transform 0.1s;
        }
        .btn-status:active { transform: scale(0.97); }
        .btn-green { background: #16a34a; border-color: #4ade80; }
        .btn-yellow { background: #ca8a04; border-color: #fde047; }
        .btn-orange { background: #ea580c; border-color: #fdba74; }
        .btn-red { background: #991b1b; grid-column: span 2; font-size: 26px; padding: 24px; border-color: #f87171; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        .select-driver-slot { 
            background: #000; 
            color: #00f0ff; 
            border: 2px solid #00f0ff; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 10px; 
            outline: none;
        }

        /* COMMAND MONITOR VIEW */
        .sidebar { 
            width: 380px; 
            background: rgba(2, 9, 38, 0.95); 
            border-right: 2px solid #00f0ff; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            gap: 12px; 
            flex-shrink: 0; 
        }
        
        .panel-glass { background: rgba(0, 120, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 12px; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        .input-row select { background: #000; color: #fff; border: 1px solid #00f0ff; padding: 8px; border-radius: 6px; flex: 1; }
        .btn-group-row { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { background: #00f0ff; color: #020926; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 2; }
        .erase-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 1; }

        .bus-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .bus-item { 
            background: rgba(255,255,255,0.05); 
            padding: 10px; 
            border-radius: 6px; 
            border-left: 5px solid #00f0ff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .badge-GREEN { background: #16a34a; color: #fff; }
        .badge-YELLOW { background: #ca8a04; color: #fff; }
        .badge-ORANGE { background: #ea580c; color: #fff; }
        .badge-RED { background: #dc2626; color: #fff; box-shadow: 0 0 10px #dc2626; }

        .tooltip {
            position: absolute;
            background: rgba(2, 9, 38, 0.95);
            border: 2px solid #00f0ff;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 6000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="view-switcher">
        <div class="school-branding-tag" id="header-district-name">TACNET SCHOOL SYSTEM</div>
        <div class="nav-btn-group">
            <button id="tab-setup" class="nav-btn nav-btn-setup active" onclick="showView('setup')">⚙️ LOCATION SETUP</button>
            <button id="tab-driver" class="nav-btn" onclick="showView('driver')">🏠 DRIVER UI</button>
            <button id="tab-command" class="nav-btn" onclick="showView('command')">🖥️ MONITOR MAP</button>
        </div>
    </div>

    <div id="main-container">

        <div id="setup-view" class="view-panel">
            <div class="setup-card">
                <h2 style="color: #fbbf24; font-size: 18px; border-bottom: 2px solid #fbbf24; padding-bottom: 6px;">⚙️ CAMPUS & LOCATION SETUP</h2>
                
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>School District Name</label>
                        <input type="text" id="cfg-district" placeholder="Amherst County Public Schools" value="Amherst County Public Schools" autocomplete="off">
                    </div>
                    <div class="form-group full-width">
                        <label>School Campus Name</label>
                        <input type="text" id="cfg-school" placeholder="Amherst County High School" value="Amherst County High School" autocomplete="off">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Full Campus Street Address</label>
                        <input type="text" id="cfg-address" placeholder="139 Lancer Lane" value="139 Lancer Lane" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label>City / Town</label>
                        <input type="text" id="cfg-city" placeholder="Amherst" value="Amherst" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>State & Zip Code</label>
                        <input type="text" id="cfg-state-zip" placeholder="VA 24521" value="VA 24521" autocomplete="off">
                    </div>
                </div>

                <button type="button" class="btn-save-setup" onclick="applySetup()">💾 SAVE LOCATION & OPEN MONITOR MAP</button>
            </div>

            <div class="map-card">
                <div style="padding: 10px; background: rgba(0, 240, 255, 0.1); border-bottom: 1px solid #00f0ff; font-size: 13px; font-weight: bold; color: #00f0ff;">
                    📍 CLICK ANYWHERE ON MAP TO PIN CAMPUS CENTER
                </div>
                <div class="map-canvas-wrapper" id="setup-canvas-wrap">
                    <canvas id="setupCanvas"></canvas>
                </div>
            </div>
        </div>
        
        <div id="driver-view" class="view-panel hidden">
            <div class="glass-card">
                <div class="driver-header">
                    <div class="main-title">TACNET SCHOOL</div>
                    <div class="school-title-sub" id="driver-school-display">UNCONFIGURED</div>
                    <div class="school-address-sub" id="driver-address-display">Location Unconfigured</div>
                </div>
            </div>

            <div class="glass-card">
                <label style="color: #00f0ff; font-weight: bold;">ACTIVE BUS UNIT:</label>
                <select id="select-active-driver-slot" class="select-driver-slot" onchange="syncDriverView()"></select>
                <div style="font-size: 26px; font-weight: 900; color: #00f0ff;" id="driver-bus-title">Slot #1</div>
                <div style="font-size: 18px; color: #fff;" id="driver-name-sub">Driver: Unassigned</div>

                <div class="grid-buttons">
                    <button class="btn-status btn-green" onclick="setDriverStatus('GREEN')">GREEN (NORMAL)</button>
                    <button class="btn-status btn-yellow" onclick="setDriverStatus('YELLOW')">YELLOW (DELAY)</button>
                    <button class="btn-status btn-orange" onclick="setDriverStatus('ORANGE')">ORANGE (MECHANICAL)</button>
                    <button class="btn-status btn-red" onclick="setDriverStatus('RED')">🚨 RED EMERGENCY</button>
                </div>
            </div>
        </div>

        <div id="command-view" class="view-panel hidden">
            <div class="sidebar">
                <div class="panel-glass">
                    <p style="color: #00f0ff; font-weight: bold;">✏️ ASSIGN BUS & DRIVER</p>
                    <div class="input-row">
                        <select id="select-slot" onchange="populateInputs()"></select>
                    </div>
                    <div class="input-row">
                        <input type="text" id="input-bus-num" placeholder="Bus #" autocomplete="off">
                        <input type="text" id="input-driver-name" placeholder="Driver Name" autocomplete="off">
                    </div>
                    <div class="btn-group-row">
                        <button class="action-btn" onclick="saveSlot()">💾 Save Unit</button>
                        <button class="erase-btn" onclick="clearSlot()">🗑️ Clear</button>
                    </div>
                </div>

                <div style="font-size: 16px; font-weight: bold; color: #00f0ff;">Active Fleet Units</div>
                <div class="bus-list" id="bus-list"></div>
            </div>

            <div class="map-card">
                <div class="map-canvas-wrapper" id="monitor-canvas-wrap">
                    <canvas id="monitorCanvas"></canvas>
                    <div id="tooltip" class="tooltip"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let CONFIG = {
            district: "Amherst County Public Schools",
            school: "Amherst County High School",
            address: "139 Lancer Lane",
            city: "Amherst",
            state_zip: "VA 24521",
            pinX: 0.5,
            pinY: 0.5
        };

        let fleet = [];
        let activeDriverIndex = 0;

        function initFleet() {
            fleet = [];
            for (let i = 1; i <= 20; i++) {
                fleet.push({
                    slot: i,
                    id: i === 1 ? '101' : (i === 2 ? '104' : ''),
                    driver: i === 1 ? 'John Doe' : (i === 2 ? 'Jane Smith' : ''),
                    status: 'GREEN',
                    relX: (Math.random() - 0.5) * 0.5,
                    relY: (Math.random() - 0.5) * 0.4
                });
            }
        }

        /* DIRECT CANVAS MAP RENDERER - NO CDN OR WEB TILES NEEDED */
        function renderCanvasMap(canvasId, isSetup) {
            let canvas = document.getElementById(canvasId);
            if (!canvas) return;
            let wrap = canvas.parentElement;
            
            canvas.width = wrap.clientWidth;
            canvas.height = wrap.clientHeight;
            
            let ctx = canvas.getContext('2d');
            let w = canvas.width;
            let h = canvas.height;

            // Background terrain base
            ctx.fillStyle = '#06122e';
            ctx.fillRect(0, 0, w, h);

            // Draw Road Grid Network
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 24;
            ctx.beginPath();
            
            // Major highways and roads
            ctx.moveTo(0, h * 0.3); ctx.lineTo(w, h * 0.35);
            ctx.moveTo(0, h * 0.7); ctx.lineTo(w, h * 0.65);
            ctx.moveTo(w * 0.25, 0); ctx.lineTo(w * 0.3, h);
            ctx.moveTo(w * 0.75, 0); ctx.lineTo(w * 0.7, h);
            ctx.stroke();

            // Primary Access Road
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(w * 0.3, h * 0.32);
            ctx.lineTo(w * CONFIG.pinX, h * CONFIG.pinY);
            ctx.stroke();

            // Campus Perimeter Boundary Box
            let cx = w * CONFIG.pinX;
            let cy = h * CONFIG.pinY;
            let pw = 240;
            let ph = 160;

            ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.fillRect(cx - pw/2, cy - ph/2, pw, ph);

            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.strokeRect(cx - pw/2, cy - ph/2, pw, ph);
            ctx.setLineDash([]);

            // Campus Label
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`🏫 CAMPUS PERIMETER BOUNDARY`, cx, cy - ph/2 - 10);

            if (isSetup) {
                // Setup Pin Icon
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
            } else {
                // Draw Active Bus Units
                fleet.forEach((b, idx) => {
                    let bx = cx + (b.relX * w);
                    let by = cy + (b.relY * h);
                    b.currentX = bx;
                    b.currentY = by;

                    let color = '#22c55e';
                    if (b.status === 'YELLOW') color = '#eab308';
                    if (b.status === 'ORANGE') color = '#f97316';
                    if (b.status === 'RED') color = '#ef4444';

                    // Outer pulse ring
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath(); ctx.arc(bx, by, 18, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1.0;

                    // Inner Marker Circle
                    ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();

                    // Bus Number Text Label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    let label = b.id ? `#${b.id}` : `S#${b.slot}`;
                    ctx.fillText(label, bx, by - 14);
                });
            }
        }

        // Setup Map Click Handler
        document.getElementById('setup-canvas-wrap').addEventListener('click', function(e) {
            let rect = this.getBoundingClientRect();
            CONFIG.pinX = (e.clientX - rect.left) / rect.width;
            CONFIG.pinY = (e.clientY - rect.top) / rect.height;
            renderCanvasMap('setupCanvas', true);
        });

        // Command Map Hover Tooltip Handler
        let monitorWrap = document.getElementById('monitor-canvas-wrap');
        let tooltip = document.getElementById('tooltip');

        monitorWrap.addEventListener('mousemove', function(e) {
            let rect = this.getBoundingClientRect();
            let mx = e.clientX - rect.left;
            let my = e.clientY - rect.top;
            
            let found = false;
            fleet.forEach(b => {
                if (b.currentX && Math.hypot(b.currentX - mx, b.currentY - my) < 18) {
                    found = true;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (mx + 15) + 'px';
                    tooltip.style.top = (my - 20) + 'px';
                    
                    let unitTitle = b.id ? `Bus #${b.id}` : `Slot #${b.slot}`;
                    let fullAddr = [CONFIG.address, CONFIG.city, CONFIG.state_zip].filter(Boolean).join(', ');

                    tooltip.innerHTML = `
                        <b style="color:#00f0ff; font-size: 15px;">${unitTitle}</b><br>
                        <b>Driver:</b> ${b.driver || 'Unassigned'}<br>
                        <b>Status:</b> <span style="color:#fbbf24">${b.status}</span><br>
                        <div style="margin-top:4px; border-top:1px solid #00f0ff; padding-top:4px; font-size:11px;">
                            📍 ${fullAddr}
                        </div>
                    `;
                }
            });

            if (!found) tooltip.style.display = 'none';
        });

        monitorWrap.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

        function applySetup() {
            CONFIG.district = document.getElementById('cfg-district').value.trim() || "District Unspecified";
            CONFIG.school = document.getElementById('cfg-school').value.trim() || "School Campus";
            CONFIG.address = document.getElementById('cfg-address').value.trim() || "";
            CONFIG.city = document.getElementById('cfg-city').value.trim() || "";
            CONFIG.state_zip = document.getElementById('cfg-state-zip').value.trim() || "";

            updateApp();
            showView('command');
        }

        function setDriverStatus(status) {
            let i = parseInt(document.getElementById('select-active-driver-slot').value) || 0;
            fleet[i].status = status;
            renderSidebar();
            renderCanvasMap('monitorCanvas', false);
        }

        function updateApp() {
            document.getElementById('header-district-name').innerText = CONFIG.district.toUpperCase();
            document.getElementById('driver-school-display').innerText = `${CONFIG.school} - ${CONFIG.district}`;
            document.getElementById('driver-address-display').innerText = [CONFIG.address, CONFIG.city, CONFIG.state_zip].filter(Boolean).join(', ');

            renderDropdowns();
            renderSidebar();
            populateInputs();
            syncDriverView();
        }

        function renderDropdowns() {
            let options = fleet.map((b, i) => `<option value="${i}">${b.id ? 'Bus #' + b.id : 'Slot #' + b.slot} ${b.driver ? '(' + b.driver + ')' : ''}</option>`).join('');
            document.getElementById('select-slot').innerHTML = options;
            document.getElementById('select-active-driver-slot').innerHTML = options;
        }

        function populateInputs() {
            let i = parseInt(document.getElementById('select-slot').value) || 0;
            document.getElementById('input-bus-num').value = fleet[i].id;
            document.getElementById('input-driver-name').value = fleet[i].driver;
        }

        function saveSlot() {
            let i = parseInt(document.getElementById('select-slot').value);
            fleet[i].id = document.getElementById('input-bus-num').value.trim();
            fleet[i].driver = document.getElementById('input-driver-name').value.trim();

            renderDropdowns();
            document.getElementById('select-slot').value = i;
            renderSidebar();
            syncDriverView();
            renderCanvasMap('monitorCanvas', false);
        }

        function clearSlot() {
            let i = parseInt(document.getElementById('select-slot').value);
            fleet[i].id = '';
            fleet[i].driver = '';
            document.getElementById('input-bus-num').value = '';
            document.getElementById('input-driver-name').value = '';

            renderDropdowns();
            document.getElementById('select-slot').value = i;
            renderSidebar();
            syncDriverView();
            renderCanvasMap('monitorCanvas', false);
        }

        function syncDriverView() {
            let i = parseInt(document.getElementById('select-active-driver-slot').value) || 0;
            document.getElementById('driver-bus-title').innerText = fleet[i].id ? `Bus #${fleet[i].id}` : `Slot #${fleet[i].slot}`;
            document.getElementById('driver-name-sub').innerText = fleet[i].driver ? `Driver: ${fleet[i].driver}` : `Driver: Unassigned`;
        }

        function renderSidebar() {
            document.getElementById('bus-list').innerHTML = fleet.map(b => `
                <div class="bus-item" style="border-left-color: ${b.status==='GREEN'?'#22c55e':(b.status==='YELLOW'?'#eab308':(b.status==='ORANGE'?'#f97316':'#ef4444'))}">
                    <div><b>${b.id ? 'Bus #' + b.id : 'Slot #' + b.slot}</b> (${b.driver || 'Unassigned'})</div>
                    <span class="badge badge-${b.status}">${b.status}</span>
                </div>
            `).join('');
        }

        function showView(view) {
            document.getElementById('setup-view').classList.toggle('hidden', view !== 'setup');
            document.getElementById('driver-view').classList.toggle('hidden', view !== 'driver');
            document.getElementById('command-view').classList.toggle('hidden', view !== 'command');

            document.getElementById('tab-setup').classList.toggle('active', view === 'setup');
            document.getElementById('tab-driver').classList.toggle('active', view === 'driver');
            document.getElementById('tab-command').classList.toggle('active', view === 'command');

            setTimeout(() => {
                if (view === 'setup') renderCanvasMap('setupCanvas', true);
                if (view === 'command') renderCanvasMap('monitorCanvas', false);
            }, 50);
        }

        window.onload = function() {
            initFleet();
            updateApp();
            showView('setup');
        };

        window.onresize = function() {
            renderCanvasMap('setupCanvas', true);
            renderCanvasMap('monitorCanvas', false);
        };
    </script>
</body>
</html>
